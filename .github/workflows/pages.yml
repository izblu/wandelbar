# Prüft jede Änderung und veröffentlicht auf GitHub Pages:
# - main               -> https://<nutzer>.github.io/wandelbar/          (Hauptversion)
# - milestone/<name>   -> https://<nutzer>.github.io/wandelbar/preview/  (Vorschau des Meilensteins)
# Beide liegen als getrennte Ordner auf dem Branch gh-pages.
name: Prüfen und veröffentlichen

on:
  push:
    branches: [main, 'milestone/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Prüfen
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Playwright-Chromium installieren
        run: npx playwright install --with-deps --only-shell chromium
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit-Tests
        run: npm test
      - name: E2E-Tests (Datenschutz, Offline, Barrierefreiheit)
        run: npm run test:e2e
      - name: Playwright-Bericht sichern
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  deploy:
    name: Veröffentlichen
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Schreibzugriffe auf gh-pages nacheinander, nie gleichzeitig.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Kanal bestimmen
        id: channel
        run: |
          case "$GITHUB_REF" in
            refs/heads/main) echo "name=production" >> "$GITHUB_OUTPUT"; echo "target=root" >> "$GITHUB_OUTPUT" ;;
            refs/heads/milestone/*) echo "name=preview" >> "$GITHUB_OUTPUT"; echo "target=preview" >> "$GITHUB_OUTPUT" ;;
            *) echo "Branch $GITHUB_REF wird nicht veröffentlicht." >&2; exit 1 ;;
          esac
      - run: npm ci
      - name: Bauen
        run: npm run build
        env:
          WANDELBAR_CHANNEL: ${{ steps.channel.outputs.name }}
      - name: Auf gh-pages veröffentlichen
        run: bash scripts/deploy-gh-pages.sh dist "${{ steps.channel.outputs.target }}"
